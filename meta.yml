    data/raw/: Original questionnaire and interview/transcription source files (.docx)
    data/processed/: Cleaned CSV/Excel datasets (teacher, student, narrative codes)
    notebooks/: Jupyter notebooks for descriptive statistics, CIs and thematic coding
    scripts/: Reproducible Python analysis scripts
    figures/: Generated figures (.png, .pdf)
    tables/: Generated tables (.xlsx via openpyxl, .docx via python-docx)
    docs/: Questionnaire instruments and documentation
    environment.yml: Conda environment specification
    meta.yml: This repository/dataset metadata file
    citation.cff: Academic citation metadata (CITATION.cff standard)
    .github/workflows/reproducibility.yml: CI workflow for automated testing of notebooks and scripts
  file_formats:
