name: Reproducibility Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib seaborn statsmodels                       jupyter nbconvert nbclient openpyxl python-docx pyyaml                       pytest pytest-cov

      - name: Syntax-check all Python scripts
        run: |
          python -m compileall -q scripts/

      - name: Execute notebooks (fail on errors)
        run: |
          mkdir -p notebooks/_executed
          jupyter nbconvert --to notebook --execute --inplace             --ExecutePreprocessor.timeout=600             --ExecutePreprocessor.kernel_name=python3             notebooks/*.ipynb

      - name: Run test suite
        run: pytest -v --cov=scripts

      - name: Lint YAML configuration files
        run: |
          pip install yamllint
          yamllint -d relaxed environment.yml meta.yml .github/workflows/reproducibility.yml

      - name: Upload executed notebooks as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-${{ matrix.python-version }}
          path: notebooks/
